        <a href="index.html" class="block px-3 py-2 text-gray-700">Home</a>

        <a href="quiz.html" class="block px-3 py-2 text-gray-700">Quiz</a>

  <main class="container mx-auto px-4 py-12">
    <h1 class="text-3xl font-bold text-center mb-8">🗓️ Available Online Papers</h1>
    <div id="papers-list" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    </div>
  </main>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- Access Control Check ---
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    if (!isLoggedIn) {
      window.location.href = "landing.html"; 
    }
    
    // Your Firebase config here
    const firebaseConfig = {
      apiKey: "AIzaSyCeqwvVFwmOxIoSWI9qk64t9lnjwxYtrOs",
      authDomain: "edunish-211d0.firebaseapp.com",
      projectId: "edunish-211d0",
      storageBucket: "edunish-211d0.firebasestorage.app",
      messagingSenderId: "1002400429038",
      appId: "1:1002400429038:web:12ee9a586de10e518694ff",
      measurementId: "G-7ZSDMMKFQ0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const papersList = document.getElementById("papers-list");

    async function fetchExams() {
      papersList.innerHTML = `<div class="col-span-full text-center text-gray-500">Loading exams...</div>`;
      
      try {
        const querySnapshot = await getDocs(collection(db, "exams"));
        if (querySnapshot.empty) {
          papersList.innerHTML = `<div class="col-span-full text-center text-gray-500">No online papers available at the moment.</div>`;
          return;
        }

        papersList.innerHTML = '';
        querySnapshot.forEach(docSnapshot => {
          const exam = docSnapshot.data();
          exam.examId = docSnapshot.id;
          renderExamCard(exam);
        });
      } catch (e) {
        console.error("Error fetching exams: ", e);
        papersList.innerHTML = `<div class="col-span-full text-center text-red-500">Failed to load exams. Please try again later.</div>`;
      }
    }

    function renderExamCard(exam) {
      const now = Date.now();
      const startTime = exam.startTime.toDate();
      const endTime = exam.endTime.toDate();
      let status = '';
      let actionButton = '';
      let cardClass = '';

      if (now < startTime.getTime()) {
        status = 'Upcoming';
        cardClass = 'bg-blue-100 border-blue-200';
        actionButton = `<span class="text-sm text-blue-600">Starts: ${startTime.toLocaleString()}</span>`;
      } else if (now >= startTime.getTime() && now <= endTime.getTime()) {
        status = 'Active';
        cardClass = 'bg-green-100 border-green-200 animate-pulse';
        actionButton = `<a href="take_exam.html?examId=${exam.examId}" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Start Exam</a>`;
      } else {
        status = 'Closed';
        cardClass = 'bg-gray-100 border-gray-200 opacity-70';
        actionButton = `<span class="text-sm text-gray-500">Closed: ${endTime.toLocaleString()}</span>`;
      }

      const card = document.createElement("div");
      card.className = `p-6 rounded-xl shadow-md border-2 ${cardClass}`;
      card.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-xl font-bold">${exam.examName}</h2>
          <span class="px-2 py-1 text-xs rounded-full font-semibold ${status === 'Active' ? 'bg-green-500 text-white' : status === 'Upcoming' ? 'bg-blue-500 text-white' : 'bg-gray-500 text-white'}">
            ${status}
          </span>
        </div>
        <p class="text-sm text-gray-500 mb-4">Duration: ${exam.durationMinutes} minutes</p>
        <div class="text-center mt-4">
          ${actionButton}
        </div>
      `;
      papersList.appendChild(card);
    }

    fetchExams();
  </script>
  
  <script>lucide.createIcons();</script>
  

</body>
</html>
