<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduNish Quiz</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="quiz.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="quiz.js" defer></script>
  <!-- ContentSquare Tracking -->
  <script src="https://t.contentsquare.net/uxa/35b9288d5b5ee.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col"> 
  
  <nav id="navbar" class="fixed top-0 w-full z-50 transition-all duration-300 bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 bg-gradient-to-r from-blue-600 to-purple-600 rounded-lg flex items-center justify-center">
          <i data-lucide="book-open" class="w-5 h-5 text-white"></i>
        </div>
        <span class="text-xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
          EduNish
        </span>
      </div>
      <div class="hidden md:flex items-center space-x-8">
        <a href="index.html" class="text-gray-700 hover:text-blue-600 nav-link">Home</a>
        <a href="downloads.html" class="text-gray-700 hover:text-blue-600">Resources</a>
        <a href="quiz.html" id="quizNavBtnDesktop" class="hover:underline">Quiz</a>
        <a id="onlinePapersBtnDesktop" href="online_papers.html" class="hidden text-gray-700 hover:text-blue-600">Online Papers</a>
        <a href="community.html" class="text-gray-700 hover:text-blue-600">Community</a>
        <a id="loginBtnDesktop" href="landing.html" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white px-6 py-2 rounded-full hover:shadow-lg">Login/SignUp</a>
        <a id="profileBtnDesktop" href="profile.html"
          class="hidden px-4 py-2 bg-blue-600 text-white rounded-lg shadow hover:bg-blue-700 transition">
          My Profile
        </a>
      </div>
      <button id="mobile-menu-btn" class="md:hidden p-2">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden absolute top-full left-0 w-full bg-white shadow-md transition-all duration-300 transform scale-y-0 opacity-0 origin-top pointer-events-none">
      <div class="px-2 pt-2 pb-3 space-y-1">
        <a href="index.html" class="block px-3 py-2 text-gray-700 active">Home</a>
        <a href="downloads.html" class="block px-3 py-2 text-gray-700">Resources</a>
        <a href="quiz.html" id="quizNavBtnMobile" class="block px-3 py-2 text-gray-700">Quiz</a>
        <a id="onlinePapersBtnMobile" href="online_papers.html" class="hidden block px-3 py-2 text-gray-700">Online Papers</a>
        <a href="community.html" class="block px-3 py-2 text-gray-700">Community</a>
        <a id="loginBtnMobile" href="landing.html" class="block px-3 py-2 text-gray-800 hover:bg-gray-200">Login/SignUp</a>
        <a id="profileBtnMobile" href="profile.html"
          class="hidden block px-4 py-2 text-blue-600 hover:underline">
          My Profile
        </a>
      </div>
    </div>
  </nav>

  <main class="flex-grow flex flex-col items-center justify-center p-6 mt-16">
    <div id="selection-section" class="w-full max-w-lg bg-white rounded-xl shadow p-6 space-y-4">
      <h1 class="text-2xl font-bold text-center mb-4 text-gray-800">📘 Start Your Quiz</h1>
      <div>
        <label class="block font-medium mb-1">Select Medium</label>
        <select id="medium-select" class="w-full border rounded p-2 text-gray-800">
          <option value="">-- Choose Medium --</option>
          <option value="English">English</option>
          <option value="Sinhala">සිංහල</option>
        </select>
      </div>

      <div class="hidden">
        <label class="block font-medium mb-1">Select Grade</label>
        <select id="grade-select" class="w-full border rounded p-2 text-gray-800">
          <option value="">-- Choose Grade --</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
        </select>
      </div>

      <div class="hidden">
        <label class="block font-medium mb-1">Select Lesson</label>
        <select id="lesson-select" class="w-full border rounded p-2 text-gray-800">
          <option value="">-- Choose Lesson --</option>
        </select>
      </div>

      <div id="series-section" class="hidden">
        <label class="block font-medium mb-2">Choose Series</label>
        <div id="series-cards" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </div>
    </div>

    <div id="quiz-container" class="w-full max-w-2xl bg-white rounded-xl shadow p-6 mt-6 hidden">
      <div id="timer" class="mb-4 text-center text-xl font-bold"></div>
      <div class="mb-4">
        <div class="h-2 bg-gray-200 rounded-full">
          <div id="progress-bar" class="h-2 bg-blue-500 rounded-full" style="width:0%"></div>
        </div>
      </div>
      <h2 id="quiz-question" class="text-xl font-semibold mb-4 text-gray-800"></h2>
      <div id="quiz-options" class="space-y-2"></div>
      <button id="next-btn" class="hidden mt-4 w-full bg-blue-600 text-white px-6 py-2 rounded-lg">Next</button>
    </div>

    <div id="result-container" class="w-full max-w-lg mt-6 hidden"></div>

    <div id="progress-section" class="w-full max-w-4xl mx-auto mt-8">
      <h2 class="text-lg font-bold mb-2 text-gray-800">📊 Your Learning Journey ✨</h2>
      <div id="progress-list" class="grid gap-4"></div>
    </div>
  </main>
  
  <script>lucide.createIcons();</script>

  <script type="module" src="script.js"></script>

</body>
</html>
