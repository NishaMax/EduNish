<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - EduNish</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-2xl p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold text-center mb-6 text-blue-700">Login with Student ID</h1>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold">Student ID</label>
        <input type="text" id="studentId" class="w-full px-4 py-2 border rounded-lg" required />
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Login</button>
    </form>
    <p id="msg" class="mt-4 text-center"></p>
    <div class="mt-4 text-center">
      <a href="landing.html" class="text-sm text-gray-500 hover:underline">Go back to options</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeqwvVFwmOxIoSWI9qk64t9lnjwxYtrOs",
      authDomain: "edunish-211d0.firebaseapp.com",
      projectId: "edunish-211d0",
      storageBucket: "edunish-211d0.firebasestorage.app",
      messagingSenderId: "1002400429038",
      appId: "1:1002400429038:web:12ee9a586de10e518694ff",
      measurementId: "G-7ZSDMMKFQ0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const studentId = document.getElementById("studentId").value.trim();
      const msg = document.getElementById("msg");

      if (!studentId) {
        msg.textContent = "⚠️ Please enter your Student ID.";
        msg.className = "text-red-600 text-center";
        return;
      }

      try {
        const studentRef = doc(db, "students", studentId);
        const docSnap = await getDoc(studentRef);

        if (docSnap.exists()) {
          const studentData = docSnap.data();
          localStorage.setItem("edunishStudentData", JSON.stringify(studentData));
          localStorage.setItem("isLoggedIn", "true");
          msg.textContent = "✅ Login successful!";
          msg.className = "text-green-600 font-semibold text-center";
          setTimeout(() => (window.location.href = "profile.html"), 1500);
        } else {
          msg.textContent = "❌ Student ID not found. Please try again or create a new one.";
          msg.className = "text-red-600 text-center";
        }
      } catch (err) {
        console.error("❌ Login error:", err);
        msg.textContent = "❌ An error occurred. Please try again.";
        msg.className = "text-red-600 text-center";
      }
    });
  </script>
</body>
</html>
